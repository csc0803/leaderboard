spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:3306/leaderboarddb?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8
    username: leaderboard
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s          # 指令逾時，預設 60s
      connect-timeout: 2s